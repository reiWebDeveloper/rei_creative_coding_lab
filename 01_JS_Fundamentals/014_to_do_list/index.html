<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>To Do List</h1>
    </header>
  <main>
    <div class="todoContainer">
        <form id="todo-form">
          <p id="warningMsg"></p>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="newTodo" placeholder="Add a task" autocomplete="off" required>
            <button type="submit" id="addBtn">Add</button>
          </div>
        </form>
        <ul id="todoList"></ul>
    </div>
  </main>
  <footer>
        <p>Made by Rei Kraja</p>
        <p>Vanilla JavaScript</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
