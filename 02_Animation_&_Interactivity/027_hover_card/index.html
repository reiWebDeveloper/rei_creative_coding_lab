<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Zoo</title>

    <link rel="stylesheet" href="style.css">

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist+Pixel&display=swap" rel="stylesheet">
</head>
<body>
    <section id="firstSection">
        <h1>VISIT THE DIGITAL ZOO</h1>
    </section>
    <section id="popularAtZooSection">
        <div>
            <h2 id="popularHeading">Popular in Zoo</h2>
        </div>
        <div class="cards">
            <!--Card Layout LION-->
            <div class="card">

                <img class="shadow" 
                    src="./assets/img/card_full/LION.png" 
                    alt="Full Picture but blured and unable to watch it">

                <img class="background" 
                    src="./assets/img/card_background/LION_BG.png" 
                    alt="Dark Savana Animated Background">

                <img class="cutout" 
                    src="./assets/img/card_foreground/LION_FOREGR.png" 
                    alt="Animated Lion Picture">
                
                <div class="content">
                    <h2 class="animalName">LION</h2>
                    <p class="animalShortDesc">Lion's crest is wonderful!</p>
                </div>

            </div>

            <!--Card Layout WOLF-->
            <div class="card">

                <img class="shadow" 
                    src="./assets/img/card_full/WOLF.png" 
                    alt="Full Picture but blured and unable to watch it">

                <img class="background" 
                    src="./assets/img/card_background/WOLF_BG.png" 
                    alt="Misty Forest Animated Background">

                <img class="cutout" 
                    src="./assets/img/card_foreground/WOLF_FOREGR.png" 
                    alt="Animated Wolf Picture">
                
                <div class="content">
                    <h2 class="animalName">WOLF</h2>
                    <p class="animalShortDesc">Into the misty forests!</p>
                </div>

            </div>

            <!--Card Layout EAGLE-->
            <div class="card">

                <img class="shadow" 
                    src="./assets/img/card_full/EAGLE.png" 
                    alt="Full Picture but blured and unable to watch it">

                <img class="background" 
                    src="./assets/img/card_background/EAGLE_BG.png" 
                    alt="Golden Hour Sky Animated Background">

                <img class="cutout" 
                    src="./assets/img/card_foreground/EAGLE_FOREGR.png" 
                    alt="Animated Eagle Picture">
                
                <div class="content">
                    <h2 class="animalName">Eagle</h2>
                    <p class="animalShortDesc">The eyes of the sky!</p>
                </div>

            </div>
        </div>
    </section>
    <section id="visit">
        <div id="tickets" class="program">
            <img src="./assets/img/backgrounds/ticket.png" alt="A ticket/coupon image">
            <div class="buttonAction">
                <p class="programTxt">BUY eTICKETS NOW -></p>
            </div>
        </div>
        <div id="childProgram" class="program">
            <img src="./assets/img/backgrounds/visit.png" alt="A red panda in the zoo image">
            <div class="buttonAction">
                <p class="programTxt">VISIT ANIMAL CENTER -></p>
            </div>
        </div>
    </section>

    <script src="script.js" defer></script>
</body>
</html>
